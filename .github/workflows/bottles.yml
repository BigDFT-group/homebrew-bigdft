name: Build and Upload Bottles

on:
  release:
    types: [created]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-bottles:
    strategy:
      matrix:
        os:
          - macos-13      # Intel Mac
          - macos-14      # ARM Mac (M1/M2)
          # - ubuntu-22.04  # Uncomment if you want Linux bottles
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      
      - name: Checkout tap repository
        uses: actions/checkout@v4
      
      - name: Tap this repository
        run: |
          brew tap ${{ github.repository }}
      
      - name: Install dependencies and build bottle
        run: |
          # Install build dependencies
          brew install --only-dependencies ${{ github.repository }}/bigdft
          
          # Build the bottle
          brew install --build-bottle ${{ github.repository }}/bigdft
          brew bottle --json ${{ github.repository }}/bigdft
      
      - name: Upload bottle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bottles-${{ matrix.os }}
          path: |
            *.bottle.*
          retention-days: 1
  
  upload-bottles:
    needs: build-bottles
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to upload to releases
    
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download all bottle artifacts
        uses: actions/download-artifact@v4
        with:
          path: bottles
          pattern: bottles-*
          merge-multiple: true
      
      - name: Display downloaded bottles
        run: |
          echo "Downloaded bottles:"
          ls -la bottles/
      
      - name: Upload bottles to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the tag name from the event
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            # For manual triggers, use the latest tag
            TAG=$(git describe --tags --abbrev=0)
          fi
          
          echo "Uploading bottles for tag: $TAG"
          
          # Upload all bottle tarballs
          cd bottles
          for bottle in *.bottle.tar.gz; do
            echo "Uploading $bottle"
            gh release upload "$TAG" "$bottle" --repo ${{ github.repository }} --clobber
          done
      
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      
      - name: Update formula with bottle info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the tag
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(git describe --tags --abbrev=0)
          fi
          
          # Merge bottle JSON files
          brew tap ${{ github.repository }}
          cd bottles
          
          # Use brew bottle --merge to update the formula
          for json in *.bottle.json; do
            echo "Processing $json"
            brew bottle --merge --write "$json" --root-url="https://github.com/${{ github.repository }}/releases/download/$TAG"
          done
          
          # Copy updated formula back to repo
          cp $(brew --repository)/Library/Taps/${{ github.repository }}/Formula/bigdft.rb \
             $GITHUB_WORKSPACE/Formula/bigdft.rb
      
      - name: Commit and push updated formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Formula/bigdft.rb
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add bottles for ${GITHUB_REF#refs/tags/}"
            git push
          fi
